
services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    depends_on:
      - worker

  worker:
    build: ./worker
    ports:
      - "8001:8001"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api